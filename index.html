<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بوابة TCF Canada — من A0 حتى B2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Noto+Sans+Arabic:wght@400;600;700&family=Noto+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F1D33;
  --ink-2:#16294a;
  --ink-3:#1e335a;
  --paper:#F3EFE4;
  --paper-dim:#c9c4b3;
  --gold:#C9A227;
  --gold-soft:#e8cf7a;
  --maple:#C0453A;
  --ok:#6E9B7B;
  --bad:#c0453a;
  --line:rgba(243,239,228,0.14);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(circle at 12% 8%, rgba(201,162,39,0.10), transparent 40%),
    radial-gradient(circle at 90% 85%, rgba(192,69,58,0.10), transparent 45%),
    var(--ink);
  color:var(--paper);
  font-family:'Noto Sans Arabic','Noto Sans',sans-serif;
  min-height:100vh;
  line-height:1.7;
}
.fr{font-family:'Noto Sans',sans-serif;direction:ltr;text-align:left;}
h1,h2,h3,.display{font-family:'Fraunces','Noto Sans Arabic',serif;}
.mono{font-family:'Space Mono',monospace;letter-spacing:0.04em;}

/* ---- shell ---- */
.shell{max-width:1180px;margin:0 auto;padding:28px 20px 80px;}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:26px;}
.brand{display:flex;align-items:center;gap:14px;}
.seal{width:52px;height:52px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;color:var(--gold);font-family:'Space Mono',monospace;font-weight:700;font-size:13px;flex-shrink:0;}
.brand h1{font-size:26px;margin:0;color:var(--paper);}
.brand p{margin:2px 0 0;color:var(--paper-dim);font-size:13.5px;}
.progress-pill{background:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:13px;color:var(--gold-soft);white-space:nowrap;}

/* ---- passport strip (levels) ---- */
.passport{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px;}
.pp-tab{
  position:relative;flex:1;min-width:110px;
  background:var(--ink-2);border:1px solid var(--line);border-radius:10px;
  padding:14px 10px 12px;text-align:center;cursor:pointer;transition:.15s;
}
.pp-tab:hover{border-color:var(--gold-soft);}
.pp-tab.active{background:var(--ink-3);border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;}
.pp-tab .code{font-family:'Space Mono',monospace;font-size:20px;font-weight:700;color:var(--paper);}
.pp-tab .lbl{font-size:11px;color:var(--paper-dim);margin-top:2px;}
.stamp{
  position:absolute;top:-10px;left:-8px;width:34px;height:34px;border-radius:50%;
  border:2px solid var(--maple);color:var(--maple);display:flex;align-items:center;justify-content:center;
  font-size:16px;background:var(--ink);transform:rotate(-14deg);
}

/* ---- skill tabs ---- */
.skills{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap;}
.sk-tab{
  background:transparent;border:1px solid var(--line);color:var(--paper-dim);
  padding:10px 16px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;
  display:flex;align-items:center;gap:8px;transition:.15s;
}
.sk-tab.active{background:var(--gold);border-color:var(--gold);color:var(--ink);}
.sk-tab .badge{width:8px;height:8px;border-radius:50%;background:var(--ok);display:none;}
.sk-tab.done .badge{display:inline-block;}

/* ---- card ---- */
.card{background:var(--ink-2);border:1px solid var(--line);border-radius:14px;padding:26px;margin-bottom:20px;}
.card h2{margin:0 0 4px;font-size:20px;color:var(--paper);}
.card .sub{color:var(--gold-soft);font-size:13px;margin-bottom:18px;}
.instr{background:var(--ink-3);border-radius:10px;padding:14px 16px;margin-bottom:18px;font-size:14.5px;color:var(--paper-dim);border-right:3px solid var(--gold);}

.btn{
  background:var(--gold);color:var(--ink);border:none;border-radius:8px;
  padding:10px 20px;font-weight:700;font-size:14px;cursor:pointer;transition:.15s;
  font-family:'Noto Sans Arabic',sans-serif;
}
.btn:hover{background:var(--gold-soft);}
.btn.secondary{background:transparent;border:1px solid var(--gold);color:var(--gold-soft);}
.btn.secondary:hover{background:rgba(201,162,39,0.1);}
.btn:disabled{opacity:.4;cursor:not-allowed;}

.transcript-box{background:var(--ink-3);border-radius:10px;padding:16px 18px;margin:14px 0;font-size:15px;display:none;}
.passage{background:var(--ink-3);border-radius:10px;padding:18px 20px;margin-bottom:18px;font-size:15.5px;}

.q{margin:18px 0;padding-bottom:16px;border-bottom:1px solid var(--line);}
.q:last-child{border-bottom:none;}
.q .qtext{font-size:15px;color:var(--paper);margin-bottom:10px;font-weight:600;}
.opt{display:block;background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:8px;cursor:pointer;font-size:14.5px;transition:.15s;}
.opt:hover{border-color:var(--gold-soft);}
.opt input{margin-left:10px;}
.opt.correct{border-color:var(--ok);background:rgba(110,155,123,0.15);}
.opt.wrong{border-color:var(--bad);background:rgba(192,69,58,0.15);}
.explain{font-size:13px;color:var(--paper-dim);margin-top:8px;display:none;background:var(--ink);padding:8px 12px;border-radius:6px;}

.score-box{background:var(--ink-3);border:1px solid var(--gold);border-radius:10px;padding:16px 20px;margin-top:18px;text-align:center;display:none;}
.score-box .num{font-family:'Space Mono',monospace;font-size:30px;color:var(--gold-soft);}

textarea{
  width:100%;min-height:150px;background:var(--ink-3);border:1px solid var(--line);
  border-radius:10px;padding:14px;color:var(--paper);font-family:'Noto Sans',sans-serif;
  font-size:15px;resize:vertical;margin-bottom:10px;
}
.wordcount{font-size:12.5px;color:var(--paper-dim);margin-bottom:14px;}
.model-box{background:var(--ink-3);border-right:3px solid var(--ok);border-radius:10px;padding:16px 18px;margin-top:14px;display:none;}
.model-box h4{margin:0 0 8px;color:var(--ok);font-size:14px;}
.criteria{list-style:none;padding:0;margin:10px 0;}
.criteria li{font-size:13.5px;color:var(--paper-dim);padding:4px 0;}
.criteria li:before{content:"✓ ";color:var(--gold);}

.playbar{display:flex;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap;}
.footer-note{text-align:center;color:var(--paper-dim);font-size:12px;margin-top:40px;}
@media(max-width:640px){.card{padding:18px;}.brand h1{font-size:21px;}}
</style>
</head>
<body>

  <div class="top">
    <div class="brand">

      <div>

        <p>من A0 حتى B2 · الفهم والتعبير الشفوي والكتابي · بالدارجة والفرنسية</p>

/* ===================== STATE ===================== */
let currentLevel = "A0";
let currentSkill = "co";
let progress = {}; // key: "A0-co" -> {done:true, score, total}

/* ===================== STORAGE ===================== */
async function loadProgress(){
  try{
    const res = await window.storage.get('tcf-progress', false);
    if(res && res.value) progress = JSON.parse(res.value);
  }catch(e){ progress = {}; }
  render();
}
async function saveProgress(){
  try{ await window.storage.set('tcf-progress', JSON.stringify(progress), false); }catch(e){}
}

/* ===================== RENDER SHELL ===================== */
function renderLevelTabs(){
  const el = document.getElementById('levelTabs');
  el.innerHTML = LEVELS.map(lv=>{
    const doneCount = SKILLS.filter(s=>progress[lv+'-'+s.id] && progress[lv+'-'+s.id].done).length;
    const stamp = doneCount===4 ? `<div class="stamp">✓</div>` : '';
    return `<div class="pp-tab ${lv===currentLevel?'active':''}" data-level="${lv}">
      ${stamp}
      <div class="code mono">${lv}</div>
      <div class="lbl">${LEVEL_LABELS[lv]}</div>
    </div>`;
  }).join('');
  el.querySelectorAll('.pp-tab').forEach(t=>t.onclick=()=>{currentLevel=t.dataset.level; render();});
}

function renderSkillTabs(){
  const el = document.getElementById('skillTabs');
  el.innerHTML = SKILLS.map(s=>{
    const done = progress[currentLevel+'-'+s.id] && progress[currentLevel+'-'+s.id].done;
    return `<button class="sk-tab ${s.id===currentSkill?'active':''} ${done?'done':''}" data-skill="${s.id}">
      <span class="badge"></span>${s.icon} ${s.ar} <span class="fr" style="opacity:.7;font-size:12px;">(${s.fr})</span>
    </button>`;
  }).join('');
  el.querySelectorAll('.sk-tab').forEach(t=>t.onclick=()=>{currentSkill=t.dataset.skill; render();});
}

function updateGlobalProgress(){
  let done=0;
  LEVELS.forEach(lv=>SKILLS.forEach(s=>{ if(progress[lv+'-'+s.id] && progress[lv+'-'+s.id].done) done++; }));
  document.getElementById('globalProgress').textContent = `${done} / 20 تمرين خدمتي`;
}

/* ===================== RENDER CONTENT ===================== */
function render(){
  renderLevelTabs();
  renderSkillTabs();
  updateGlobalProgress();
  const data = CONTENT[currentLevel][currentSkill];
  const box = document.getElementById('content');
  if(currentSkill==='co' || currentSkill==='ce'){
    box.innerHTML = renderQuiz(data, currentSkill);
    attachQuizEvents(data);
  } else {
    box.innerHTML = renderProduction(data, currentSkill);
    attachProductionEvents(data);
  }
}

function renderQuiz(data, skill){
  const isCO = skill==='co';
  return `
  <div class="card">
    <h2>${data.title}</h2>
    <div class="sub">${SKILLS.find(s=>s.id===skill).fr} · ${currentLevel}</div>
    <div class="instr">${data.instr}</div>
    ${isCO ? `
      <div class="playbar">
        <button class="btn" id="playBtn">▶ شغل التسجيل</button>
        <button class="btn secondary" id="toggleTranscript">إظهار/إخفاء النص</button>
      </div>
      <div class="transcript-box fr" id="transcriptBox">${data.transcript}</div>
    ` : `<div class="passage fr">${data.passage}</div>`}
    <div id="questions">
      ${data.questions.map((q,qi)=>`
        <div class="q" data-qi="${qi}">
          <div class="qtext fr">${qi+1}. ${q.q}</div>
          ${q.opts.map((o,oi)=>`
            <label class="opt fr" data-oi="${oi}">
              <input type="radio" name="q${qi}" value="${oi}"> ${o}
            </label>`).join('')}
          <div class="explain" id="ex${qi}">💡 ${q.ex}</div>
        </div>
      `).join('')}
    </div>
    <button class="btn" id="checkBtn">صحح الإجابات</button>
    <div class="score-box" id="scoreBox">
      <div class="num" id="scoreNum">0/0</div>
      <div>النتيجة ديالك</div>
    </div>
  </div>`;
}

function renderProduction(data, skill){
  const isEO = skill==='eo';
  return `
  <div class="card">
    <h2>${data.title}</h2>
    <div class="sub">${SKILLS.find(s=>s.id===skill).fr} · ${currentLevel}</div>
    <div class="instr">${data.instr}</div>
    <ul class="criteria">${data.criteria.map(c=>`<li>${c}</li>`).join('')}</ul>
    ${isEO ? `
      <div class="playbar">
        <button class="btn secondary" id="prepBtn">⏱ ابدا التحضير (60 ثانية)</button>
        <span id="timerLabel" class="mono" style="color:var(--gold-soft);"></span>
      </div>
      <p style="font-size:13.5px;color:var(--paper-dim);">قول جوابك بصوت عالي (وحدك ولا سجل راسك)، من بعد قارن مع النموذج.</p>
    ` : `
      <textarea id="userText" placeholder="اكتب جوابك هنا بالفرنسية..."></textarea>
      <div class="wordcount" id="wc">0 كلمة</div>
    `}
    <button class="btn" id="revealBtn">${isEO ? 'استمع/شوف النموذج' : 'شوف نموذج التصحيح'}</button>
    <div class="model-box" id="modelBox">
      <h4>✔ نموذج مقترح (Modèle de réponse)</h4>
      <div class="fr">${data.model}</div>
      ${isEO ? `<button class="btn secondary" style="margin-top:12px;" id="playModel">▶ سمع النموذج</button>` : ''}
    </div>
  </div>`;
}

/* ===================== EVENTS: QUIZ ===================== */
function attachQuizEvents(data){
  const playBtn = document.getElementById('playBtn');
  if(playBtn){
    playBtn.onclick = ()=>{
      speak(data.transcript);
    };
  }
  const toggleT = document.getElementById('toggleTranscript');
  if(toggleT){
    toggleT.onclick = ()=>{
      const box = document.getElementById('transcriptBox');
      box.style.display = box.style.display==='block' ? 'none' : 'block';
    };
  }
  document.getElementById('checkBtn').onclick = ()=>{
    let score = 0;
    data.questions.forEach((q,qi)=>{
      const selected = document.querySelector(`input[name="q${qi}"]:checked`);
      const opts = document.querySelectorAll(`.q[data-qi="${qi}"] .opt`);
      opts.forEach((o,oi)=>{
        if(oi===q.c) o.classList.add('correct');
        else if(selected && parseInt(selected.value)===oi) o.classList.add('wrong');
      });
      document.getElementById('ex'+qi).style.display='block';
      if(selected && parseInt(selected.value)===q.c) score++;
    });
    document.getElementById('scoreBox').style.display='block';
    document.getElementById('scoreNum').textContent = `${score}/${data.questions.length}`;
    progress[currentLevel+'-'+currentSkill] = {done:true, score, total:data.questions.length};
    saveProgress();
    renderLevelTabs(); renderSkillTabs(); updateGlobalProgress();
  };
}

/* ===================== EVENTS: PRODUCTION ===================== */
function attachProductionEvents(data){
  const ta = document.getElementById('userText');
  if(ta){
    ta.oninput = ()=>{
      const words = ta.value.trim().split(/\s+/).filter(Boolean).length;
      document.getElementById('wc').textContent = `${words} كلمة`;
    };
  }
  const prepBtn = document.getElementById('prepBtn');
  if(prepBtn){
    prepBtn.onclick = ()=>{
      let t = 60;
      prepBtn.disabled = true;
      const lbl = document.getElementById('timerLabel');
      lbl.textContent = t + ' s';
      const iv = setInterval(()=>{
        t--;
        lbl.textContent = t + ' s';
        if(t<=0){ clearInterval(iv); lbl.textContent = 'الوقت سالا — دابا تكلم!'; prepBtn.disabled=false; }
      },1000);
    };
  }
  document.getElementById('revealBtn').onclick = ()=>{
    document.getElementById('modelBox').style.display='block';
    progress[currentLevel+'-'+currentSkill] = {done:true};
    saveProgress();
    renderLevelTabs(); renderSkillTabs(); updateGlobalProgress();
    const pm = document.getElementById('playModel');
    if(pm) pm.onclick = ()=> speak(data.model);
  };
}

/* ===================== SPEECH ===================== */
function speak(text){
  if(!('speechSynthesis' in window)){ alert('المتصفح ديالك ما كيدعمش قراءة الصوت.'); return; }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'fr-FR';
  u.rate = 0.92;
  const voices = window.speechSynthesis.getVoices();
  const frVoice = voices.find(v=>v.lang && v.lang.startsWith('fr'));
  if(frVoice) u.voice = frVoice;
  window.speechSynthesis.speak(u);
}
window.speechSynthesis && window.speechSynthesis.getVoices();

/* ===================== INIT ===================== */
loadProgress();
</script>
