<style>
:root{
  --ink:#0F1D33; --ink-2:#16294a; --ink-3:#1e335a;

  --line:rgba(243,239,228,0.14);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(circle at 12% 8%, rgba(201,162,39,0.10), transparent 40%),
             radial-gradient(circle at 90% 85%, rgba(192,69,58,0.10), transparent 45%), var(--ink);
  color:var(--paper); font-family:'Noto Sans Arabic','Noto Sans',sans-serif; min-height:100vh; line-height:1.7;
}
.fr{font-family:'Noto Sans',sans-serif;direction:ltr;text-align:left;}
h1,h2,h3{font-family:'Fraunces','Noto Sans Arabic',serif;}
.mono{font-family:'Space Mono',monospace;letter-spacing:0.04em;}
.shell{max-width:1180px;margin:0 auto;padding:28px 20px 80px;}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:26px;}
.brand{display:flex;align-items:center;gap:14px;}
.seal{width:52px;height:52px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;color:var(--gold);font-family:'Space Mono',monospace;font-weight:700;font-size:13px;flex-shrink:0;}
.brand h1{font-size:24px;margin:0;color:var(--paper);}
.brand p{margin:2px 0 0;color:var(--paper-dim);font-size:13.5px;}
.progress-pill{background:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:13px;color:var(--gold-soft);white-space:nowrap;}
.passport{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px;}
.pp-tab{position:relative;flex:1;min-width:105px;background:var(--ink-2);border:1px solid var(--line);border-radius:10px;padding:14px 10px 12px;text-align:center;cursor:pointer;transition:.15s;}
.pp-tab:hover{border-color:var(--gold-soft);}
.pp-tab.active{background:var(--ink-3);border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;}
.pp-tab .code{font-family:'Space Mono',monospace;font-size:20px;font-weight:700;color:var(--paper);}
.pp-tab .lbl{font-size:11px;color:var(--paper-dim);margin-top:2px;}
.stamp{position:absolute;top:-10px;left:-8px;width:32px;height:32px;border-radius:50%;border:2px solid var(--maple);color:var(--maple);display:flex;align-items:center;justify-content:center;font-size:15px;background:var(--ink);transform:rotate(-14deg);}
.skills{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
.sk-tab{background:transparent;border:1px solid var(--line);color:var(--paper-dim);padding:10px 16px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;transition:.15s;}
.sk-tab.active{background:var(--gold);border-color:var(--gold);color:var(--ink);}
.sk-tab .badge{width:8px;height:8px;border-radius:50%;background:var(--ok);display:none;}
.sk-tab.done .badge{display:inline-block;}
.card{background:var(--ink-2);border:1px solid var(--line);border-radius:14px;padding:26px;margin-bottom:20px;}
.card h2{margin:0 0 4px;font-size:20px;color:var(--paper);}
.card .sub{color:var(--gold-soft);font-size:13px;margin-bottom:16px;}
.instr{background:var(--ink-3);border-radius:10px;padding:14px 16px;margin-bottom:18px;font-size:14.5px;color:var(--paper-dim);border-right:3px solid var(--gold);}
.btn{background:var(--gold);color:var(--ink);border:none;border-radius:8px;padding:10px 20px;font-weight:700;font-size:14px;cursor:pointer;transition:.15s;font-family:'Noto Sans Arabic',sans-serif;}
.btn:hover{background:var(--gold-soft);}
.btn.secondary{background:transparent;border:1px solid var(--gold);color:var(--gold-soft);}
.btn.secondary:hover{background:rgba(201,162,39,0.1);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.progress-bar-wrap{background:var(--ink-3);border-radius:999px;height:8px;overflow:hidden;margin-bottom:6px;}
.progress-bar-fill{background:var(--gold);height:100%;transition:width .25s;}
.q-counter{font-size:12.5px;color:var(--paper-dim);margin-bottom:16px;display:flex;justify-content:space-between;}
.transcript-box{background:var(--ink-3);border-radius:10px;padding:16px 18px;margin:14px 0;font-size:15px;display:none;}
.passage{background:var(--ink-3);border-radius:10px;padding:18px 20px;margin-bottom:18px;font-size:15.5px;}
.qtext{font-size:16px;color:var(--paper);margin-bottom:14px;font-weight:600;}
.opt{display:block;background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin-bottom:9px;cursor:pointer;font-size:15px;transition:.12s;}
.opt:hover{border-color:var(--gold-soft);background:rgba(201,162,39,0.06);}
.opt.correct{border-color:var(--ok);background:rgba(110,155,123,0.18);}
.opt.wrong{border-color:var(--bad);background:rgba(192,69,58,0.18);}
.opt.dim{opacity:.55;}
.playbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.review-item{border-bottom:1px solid var(--line);padding:14px 0;}
.review-item:last-child{border-bottom:none;}
.review-item .q{font-size:14.5px;color:var(--paper);margin-bottom:6px;}
.review-item .ans-line{font-size:13.5px;margin-bottom:3px;}
.ok-txt{color:var(--ok);} .bad-txt{color:var(--bad);}
.explain{font-size:13px;color:var(--paper-dim);margin-top:4px;}
.score-box{background:var(--ink-3);border:1px solid var(--gold);border-radius:10px;padding:18px 20px;margin-bottom:20px;text-align:center;}
.score-box .num{font-family:'Space Mono',monospace;font-size:34px;color:var(--gold-soft);}
.score-box .cecrl{font-size:13px;color:var(--paper-dim);margin-top:4px;}
.task-tabs{display:flex;gap:8px;margin-bottom:18px;}
.task-tab{background:var(--ink-3);border:1px solid var(--line);color:var(--paper-dim);padding:8px 14px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:600;}
.task-tab.active{background:var(--gold);border-color:var(--gold);color:var(--ink);}
.task-tab.viewed{border-color:var(--ok);}
.task-tag{display:inline-block;background:var(--ink-3);color:var(--gold-soft);font-size:11px;padding:3px 9px;border-radius:999px;margin-bottom:10px;font-family:'Space Mono',monospace;}
textarea{width:100%;min-height:150px;background:var(--ink-3);border:1px solid var(--line);border-radius:10px;padding:14px;color:var(--paper);font-family:'Noto Sans',sans-serif;font-size:15px;resize:vertical;margin-bottom:8px;}
.wordcount{font-size:12.5px;color:var(--paper-dim);margin-bottom:14px;}
.model-box{background:var(--ink-3);border-right:3px solid var(--ok);border-radius:10px;padding:16px 18px;margin-top:14px;display:none;}
.model-box h4{margin:0 0 8px;color:var(--ok);font-size:14px;}
.criteria{list-style:none;padding:0;margin:10px 0;}
.criteria li{font-size:13.5px;color:var(--paper-dim);padding:4px 0;}
.criteria li:before{content:"✓ ";color:var(--gold);}
.footer-note{text-align:center;color:var(--paper-dim);font-size:12px;margin-top:40px;}
@media(max-width:640px){.card{padding:18px;}.brand h1{font-size:20px;}}
</style>
</head>

/* ===================== STATE ===================== */
let currentLevel = "A0";
let currentSkill = "co";
let currentQIndex = 0;
let currentTask = 0;
let guideMode = false;
let state = { answers:{}, taskViewed:{} };

/* ===================== STORAGE ===================== */
async function loadState(){
  try{
    const res = await window.storage.get('tcf-exam-state', false);
    if(res && res.value) state = JSON.parse(res.value);
  }catch(e){ state = { answers:{}, taskViewed:{} }; }
  enterCurrent();
  render();
}
async function saveState(){
  try{ await window.storage.set('tcf-exam-state', JSON.stringify(state), false); }catch(e){}
}

/* ===================== HELPERS ===================== */
function quizKey(lv,sk){ return lv+'-'+sk; }
function isQuizSkill(sk){ return sk==='co' || sk==='ce'; }

function enterCurrent(){
  if(isQuizSkill(currentSkill)){
    const key = quizKey(currentLevel,currentSkill);
    const items = CONTENT[currentLevel][currentSkill];
    if(!state.answers[key]) state.answers[key] = new Array(items.length).fill(null);
    const idx = state.answers[key].findIndex(a=>a===null);
    currentQIndex = idx===-1 ? items.length : idx;
  } else {
    currentTask = 0;
  }
}

function levelDone(lv){
  return SKILLS.every(s=>skillDone(lv,s.id));
}
function skillDone(lv,sk){
  if(isQuizSkill(sk)){
    const key = quizKey(lv,sk);
    const arr = state.answers[key];
    return arr && arr.every(a=>a!==null);
  } else {
    const tasks = CONTENT[lv][sk];
    return tasks.every((t,i)=> state.taskViewed[lv+'-'+sk+'-'+i]);
  }
}
function globalPercent(){
  let total=0, done=0;
  LEVELS.forEach(lv=>SKILLS.forEach(s=>{
    if(isQuizSkill(s.id)){
      const items = CONTENT[lv][s.id];
      total += items.length;
      const arr = state.answers[quizKey(lv,s.id)];
      if(arr) done += arr.filter(a=>a!==null).length;
    } else {
      const tasks = CONTENT[lv][s.id];
      total += tasks.length;
      tasks.forEach((t,i)=>{ if(state.taskViewed[lv+'-'+s.id+'-'+i]) done++; });
    }
  }));
  return Math.round(done/total*100);
}

/* ===================== RENDER SHELL ===================== */
function renderLevelTabs(){
  const el = document.getElementById('levelTabs');
  el.innerHTML = LEVELS.map(lv=>{
    const stamp = levelDone(lv) ? `<div class="stamp">✓</div>` : '';
    return `<div class="pp-tab ${lv===currentLevel?'active':''}" data-level="${lv}">
      ${stamp}<div class="code mono">${lv}</div><div class="lbl">${LEVEL_LABELS[lv]}</div>
    </div>`;
  }).join('');
  el.querySelectorAll('.pp-tab').forEach(t=>t.onclick=()=>{currentLevel=t.dataset.level; enterCurrent(); render();});
}
function renderSkillTabs(){
  const el = document.getElementById('skillTabs');
  el.innerHTML = SKILLS.map(s=>{
    const done = skillDone(currentLevel,s.id);
    return `<button class="sk-tab ${s.id===currentSkill?'active':''} ${done?'done':''}" data-skill="${s.id}">
      <span class="badge"></span>${s.icon} ${s.ar} <span class="fr" style="opacity:.7;font-size:12px;">(${s.fr})</span>
    </button>`;
  }).join('');
  el.querySelectorAll('.sk-tab').forEach(t=>t.onclick=()=>{currentSkill=t.dataset.skill; enterCurrent(); render();});
}
function updateGlobalProgress(){
  document.getElementById('globalProgress').textContent = globalPercent()+'% خدمتي';
}

/* ===================== RENDER CONTENT ===================== */
function render(){
  renderLevelTabs(); renderSkillTabs(); updateGlobalProgress();
  const box = document.getElementById('content');
  const guideBtn = document.getElementById('guideBtn');
  guideBtn.onclick = ()=>{ guideMode = !guideMode; render(); };
  guideBtn.textContent = guideMode ? '⬅ رجع للتمارين' : '📘 دليل الاستراتيجية والقوالب';
  document.getElementById('levelTabs').style.display = guideMode ? 'none' : 'flex';
  document.getElementById('skillTabs').style.display = guideMode ? 'none' : 'flex';
  if(guideMode){ box.innerHTML = renderGuide(); return; }
  if(isQuizSkill(currentSkill)) box.innerHTML = renderQuizScreen();
  else box.innerHTML = renderTaskScreen();
  attachEvents();
}

function renderQuizScreen(){
  const items = CONTENT[currentLevel][currentSkill];
  const key = quizKey(currentLevel,currentSkill);
  const skillMeta = SKILLS.find(s=>s.id===currentSkill);
  if(currentQIndex >= items.length){
    const arr = state.answers[key];
    let score=0;
    const rows = items.map((it,i)=>{
      const chosen = arr[i];
      const correct = chosen===it.c;
      if(correct) score++;
      const letters=['A','B','C','D'];
      return `<div class="review-item">
        <div class="q fr">${i+1}. ${it.question}</div>
        <div class="ans-line ${correct?'ok-txt':'bad-txt'} fr">جوابك: ${chosen!==null?letters[chosen]+') '+it.opts[chosen]:'—'} ${correct?'✓':'✗'}</div>
        ${!correct?`<div class="ans-line ok-txt fr">الجواب الصحيح: ${letters[it.c]}) ${it.opts[it.c]}</div>`:''}
        <div class="explain">💡 ${it.ex}</div>
      </div>`;
    }).join('');
    return `<div class="card">
      <h2>${skillMeta.ar} — ${currentLevel}</h2>
      <div class="score-box">
        <div class="num">${score} / ${items.length}</div>
        <div class="cecrl">مستوى ${currentLevel} · التصحيح الكامل تحت</div>
      </div>
      ${rows}
      <button class="btn" id="retakeBtn" style="margin-top:16px;">أعد الاختبار من البداية</button>
    </div>`;
  }
  const it = items[currentQIndex];
  const pct = Math.round(currentQIndex/items.length*100);
  const letters=['A','B','C','D'];
  return `<div class="card">
    <h2>${skillMeta.ar} — ${currentLevel}</h2>
    <div class="sub">${skillMeta.fr} · سؤال ${currentQIndex+1} من ${items.length}</div>
    <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
    <div class="q-counter"><span>السؤال ${currentQIndex+1}/${items.length}</span><span>ما ترجعش تقدر تبدل الجواب من بعد ما تختار</span></div>
    ${currentSkill==='co' ? `
      <div class="playbar">
        <button class="btn" id="playBtn">▶ شغل التسجيل</button>
        <button class="btn secondary" id="toggleTranscript">إظهار/إخفاء النص</button>
      </div>
      <div class="transcript-box fr" id="transcriptBox">${it.stim}</div>
    ` : `<div class="passage fr">${it.stim}</div>`}
    <div class="qtext fr">${it.question}</div>
    <div id="optsWrap">
      ${it.opts.map((o,oi)=>`<div class="opt fr" data-oi="${oi}">${letters[oi]}) ${o}</div>`).join('')}
    </div>
  </div>`;
}

/* ===================== EVENTS ===================== */
function attachEvents(){
  if(isQuizSkill(currentSkill)){
    const items = CONTENT[currentLevel][currentSkill];
    if(currentQIndex >= items.length){
      const retake = document.getElementById('retakeBtn');
      if(retake) retake.onclick = ()=>{
        state.answers[quizKey(currentLevel,currentSkill)] = new Array(items.length).fill(null);
        saveState(); enterCurrent(); render();
      };
      return;
    }
    const playBtn = document.getElementById('playBtn');
    if(playBtn) playBtn.onclick = ()=> speak(items[currentQIndex].stim);
    const toggleT = document.getElementById('toggleTranscript');
    if(toggleT) toggleT.onclick = ()=>{
      const b = document.getElementById('transcriptBox');
      b.style.display = b.style.display==='block' ? 'none' : 'block';
    };
    document.querySelectorAll('#optsWrap .opt').forEach(opt=>{
      opt.onclick = ()=>{
        const oi = parseInt(opt.dataset.oi);
        const key = quizKey(currentLevel,currentSkill);
        state.answers[key][currentQIndex] = oi;
        saveState();
        currentQIndex++;
        render();
      };
    });
  } else {
    document.querySelectorAll('.task-tab').forEach(tb=>{
      tb.onclick = ()=>{ currentTask = parseInt(tb.dataset.task); render(); };
    });
    const ta = document.getElementById('userText');
    if(ta) ta.oninput = ()=>{
      const words = ta.value.trim().split(/\s+/).filter(Boolean).length;
      document.getElementById('wc').textContent = `${words} كلمة`;
    };
    const prepBtn = document.getElementById('prepBtn');
    if(prepBtn){
      prepBtn.onclick = ()=>{
        const tasks = CONTENT[currentLevel][currentSkill];
        let t = tasks[currentTask].prep;
        prepBtn.disabled = true;
        const lbl = document.getElementById('timerLabel');
        lbl.textContent = t + ' s';
        const iv = setInterval(()=>{
          t--; lbl.textContent = t + ' s';
          if(t<=0){ clearInterval(iv); lbl.textContent = 'الوقت سالا — دابا تكلم!'; prepBtn.disabled=false; }
        },1000);
      };
    }
    const revealBtn = document.getElementById('revealBtn');
    if(revealBtn) revealBtn.onclick = ()=>{
      document.getElementById('modelBox').style.display='block';
      state.taskViewed[currentLevel+'-'+currentSkill+'-'+currentTask] = true;
      saveState();
      renderLevelTabs(); renderSkillTabs(); updateGlobalProgress();
      document.querySelectorAll('.task-tab')[currentTask].classList.add('viewed');
      const pm = document.getElementById('playModel');
      if(pm) pm.onclick = ()=> speak(CONTENT[currentLevel][currentSkill][currentTask].model);
    };
  }
}

/* ===================== SPEECH ===================== */
function speak(text){
  if(!('speechSynthesis' in window)){ alert('المتصفح ديالك ما كيدعمش قراءة الصوت.'); return; }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'fr-FR'; u.rate = 0.92;
  const voices = window.speechSynthesis.getVoices();
  const frVoice = voices.find(v=>v.lang && v.lang.startsWith('fr'));
  if(frVoice) u.voice = frVoice;
  window.speechSynthesis.speak(u);
}
window.speechSynthesis && window.speechSynthesis.getVoices();

/* ===================== INIT ===================== */
loadState();
</script>
